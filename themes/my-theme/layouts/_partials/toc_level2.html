{{ range .Headings }}
  {{ if and (ge .Level site.Params.toc2.startLevel)
            (le .Level site.Params.toc2.endLevel) }}
    <div class="navside-item"><a class="toc-level-{{ .Level }}"
            href="#{{ .ID }}">{{ .Title | htmlUnescape }}</a></div>
  {{ end }}
  {{ partial "toc_level2.html" . }}
{{ end }}
